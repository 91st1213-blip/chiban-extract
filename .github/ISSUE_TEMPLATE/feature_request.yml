name: Feature request
description: Suggest a new address kind, an API, or a CLI improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the use case. "I'm parsing X kind of document and I need Y."
        Concrete examples make this much easier to evaluate.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: |
        If you have an idea of the API shape or behavior, sketch it here.
        Otherwise leave blank — the use case is what matters.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: |
        Have you tried other libraries (`japanese-address-parser`, etc.) or
        a custom regex? Why did they not fit?
